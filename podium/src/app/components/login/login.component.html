<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Branding Creativo de PODIUM -->
    <div class="login-brand animate-fade-in">
      <div class="logo-wrapper">
        <mat-icon class="login-logo">leaderboard</mat-icon>
      </div>
      <h1 class="brand-title">PODIUM</h1>
      <p class="brand-subtitle">Finance & Orders</p>
    </div>

    <!-- Tarjeta de Login Glassmorphic -->
    <mat-card class="podium-card login-card glass-card animate-slide-up">
      <mat-card-header>
        <mat-card-title>Ingreso al Sistema</mat-card-title>
        <mat-card-subtitle>Gestiona tus finanzas y pedidos de forma profesional</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" fullWidth>
            <mat-label>Usuario</mat-label>
            <mat-icon matPrefix style="margin-right: 5px;">person</mat-icon>
            <input matInput formControlName="username" placeholder="Tu usuario">
          </mat-form-field>

          <mat-form-field appearance="outline" fullWidth>
            <mat-label>Contraseña</mat-label>
            <mat-icon matPrefix style="margin-right: 5px;">lock</mat-icon>
            <input matInput type="password" formControlName="password" placeholder="Tu contraseña">
          </mat-form-field>

          <div class="error-msg" *ngIf="error">{{ error }}</div>

          <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid" class="full-width">
            Entrar a mi cuenta
          </button>
        </form>
      </mat-card-content>
      
      <mat-card-actions style="justify-content: center;">
        <button mat-button routerLink="/register" color="accent">¿No tienes cuenta? Regístrate aquí</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
